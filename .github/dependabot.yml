# Version updates PAUSED 2026-11-23 (Jason's call): Renovate owns dependency
# version updates fleet-wide now. Dependabot security alerts stay enabled in
# repo settings; this file's limits are 0 so it opens no version-update PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Los_Angeles
    groups:
      actions-maintenance:
        patterns:
          - "*"
    open-pull-requests-limit: 0
